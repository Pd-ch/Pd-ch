name: Waka Readme

on:
  schedule:
    - cron: '0 20 * * *' 
  workflow_dispatch:     # 支持手动触发

jobs:
  update-readme:
    name: Update Readme with Metrics
    runs-on: ubuntu-latest
    steps:
      - uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.PROFILE }}
          LOCALE: zh
